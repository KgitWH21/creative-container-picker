<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Creative Container Picker</title>
  <style>
    :root{
      --chassis:#23261F;--chassis-2:#1A1D17;
      --panel:#C8C6B7;--panel-hi:#D9D7C9;--panel-low:#B2B0A1;--panel-off:#ADAB9E;
      --ink:#1E211B;--ink-2:#55584E;--ink-off:#35382F;
      --screen:#15130D;--amber:#FFB23E;--amber-dim:#C0812A;--amber-deep:#7A5417;
      --rust:#9C3A22;--focus:#7FC7FF;
      --f-label:ui-monospace,"Cascadia Mono","SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace;
      --f-display:"Arial Narrow","Helvetica Neue Condensed",Arial,sans-serif;
      --f-body:Candara,Optima,"Gill Sans MT","Trebuchet MS",sans-serif;
      --gap:9px;
    }
    *{box-sizing:border-box}
    body{margin:0;color:var(--ink);background:var(--chassis);
      background-image:repeating-linear-gradient(180deg,rgba(255,255,255,.028) 0 1px,transparent 1px 5px);
      font:15px/1.5 var(--f-body)}
    button,input,select{font:inherit}
    button{cursor:pointer}
    :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
    ::selection{background:var(--amber);color:var(--screen)}

    /* ---- rack ---- */
    .rack{width:min(1080px,calc(100% - 28px));margin:26px auto 60px}
    .rack,.strips{display:flex;flex-direction:column;gap:var(--gap)}
    .unit{background:var(--panel);border:1px solid #7E7C6E;border-top-color:#E4E2D4;border-radius:2px;
      box-shadow:0 1px 0 rgba(0,0,0,.45),inset 0 -1px 0 rgba(0,0,0,.12)}

    /* ---- nameplate ---- */
    .plate{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:20px 22px 16px}
    h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(34px,6.2vw,62px);line-height:.92;
      text-transform:uppercase;letter-spacing:.005em}
    .tagline{margin:9px 0 0;font-size:15px;color:var(--ink-2);max-width:46ch}
    .count{text-align:right;font-family:var(--f-label);flex-shrink:0}
    .count b{display:block;font-size:19px;letter-spacing:-.01em;font-weight:700}
    .count span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--ink-2);margin-top:3px}

    /* ---- readout (signature) ---- */
    .screen{background:var(--screen);border:1px solid #0B0A06;border-radius:2px;padding:18px 20px 20px;
      box-shadow:inset 0 2px 14px rgba(0,0,0,.75)}
    .screen-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
      border-bottom:1px solid #35301F;padding-bottom:10px}
    .screen-head h2{margin:0;font-family:var(--f-label);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--amber-dim)}
    .spec{display:grid;grid-template-columns:58px 1fr;gap:6px 14px;margin:16px 0 0;font-family:var(--f-label)}
    .spec dt{font-size:11px;letter-spacing:.14em;color:var(--amber-deep);padding-top:3px}
    .spec dd{margin:0;font-size:14px;color:#EBD9B6;word-break:break-word}
    .readout{margin:18px 0 0;padding-top:16px;border-top:1px solid #35301F;
      font-family:var(--f-label);font-size:clamp(14px,1.6vw,17px);line-height:1.55;color:var(--amber);text-shadow:0 0 12px rgba(255,178,62,.3)}
    .caret{display:inline-block;width:.55em;height:1.05em;background:var(--amber);vertical-align:-.18em;margin-left:2px;animation:blink 1.1s steps(1,end) infinite}
    @keyframes blink{50%{opacity:0}}
    .screen-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
    .status{min-height:18px;margin-top:12px;font-family:var(--f-label);font-size:11px;letter-spacing:.14em;
      text-transform:uppercase;color:var(--amber-dim)}

    /* ---- keys ---- */
    .key{font-family:var(--f-label);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
      background:var(--panel-hi);color:var(--ink);border:1px solid #7E7C6E;border-radius:2px;padding:9px 13px;
      box-shadow:0 1px 0 #6F6D60;transition:transform .08s,background .12s}
    .key:hover{background:#E6E4D6}
    .key:active{transform:translateY(1px);box-shadow:none}
    .key.on-screen{background:transparent;color:var(--amber-dim);border-color:#4A4331;box-shadow:none}
    .key.on-screen:hover{background:#221E12;color:var(--amber)}
    .key.danger{color:var(--rust);border-color:#8A6A5E}
    .key.danger.on-screen{color:#D5714F;border-color:#4A4331}
    .transport{display:flex;gap:var(--gap);flex-wrap:wrap;align-items:stretch}
    .transport .key{flex:1;min-width:132px;padding:15px 12px}
    .go{flex:2.2 !important;background:var(--amber);border-color:#8A5E15;box-shadow:0 2px 0 #8A5E15;font-weight:700;letter-spacing:.2em}
    .go:hover{background:#FFC163}
    .go .hint{display:inline-block;margin-left:10px;padding:2px 6px;border:1px solid rgba(0,0,0,.35);border-radius:2px;
      font-size:9px;letter-spacing:.12em;opacity:.7}
    .surprise{border-color:#8A5E15;color:#7A5417}

    /* ---- channel strips ---- */
    .ch{display:grid;grid-template-columns:84px minmax(0,1fr) 218px;align-items:stretch}
    .ch-code{border-right:1px solid #9C9A8B;padding:16px 0 16px 16px;display:flex;flex-direction:column;gap:9px}
    .code{font-family:var(--f-label);font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--ink)}
    .lamp{width:9px;height:9px;border-radius:50%;background:#8E8C7E;box-shadow:inset 0 1px 1px rgba(0,0,0,.4)}
    .ch.live .lamp{background:var(--amber);box-shadow:0 0 8px rgba(255,178,62,.85)}
    .ch-body{padding:15px 20px;min-width:0}
    .value{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:clamp(21px,2.7vw,31px);
      line-height:1.02;letter-spacing:.008em;margin:0;word-break:break-word}
    .description{margin:8px 0 0;font-size:13px;color:var(--ink-2)}
    .description b{font-family:var(--f-label);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);margin-right:6px}
    .ch-ctl{border-left:1px solid #9C9A8B;background:rgba(0,0,0,.045);padding:15px 16px;
      display:flex;flex-direction:column;justify-content:center;gap:9px}
    .sw{display:flex;align-items:center;gap:9px;font-family:var(--f-label);font-size:10px;letter-spacing:.16em;
      text-transform:uppercase;cursor:pointer}
    .sw input{appearance:none;-webkit-appearance:none;margin:0;width:34px;height:17px;border:1px solid #7E7C6E;
      border-radius:2px;background:var(--panel-low);position:relative;cursor:pointer;flex-shrink:0}
    .sw input::after{content:"";position:absolute;top:1px;left:1px;width:14px;height:13px;background:var(--panel-hi);
      border:1px solid #7E7C6E;border-radius:1px;transition:transform .12s}
    .sw input:checked{background:var(--amber-deep)}
    .sw input:checked::after{transform:translateX(15px);background:var(--amber)}
    .reroll{align-self:flex-start;margin-top:3px;font-family:var(--f-label);font-size:10px;letter-spacing:.16em;
      text-transform:uppercase;background:none;border:0;border-bottom:1px solid var(--ink-2);color:var(--ink);padding:2px 0}
    .reroll:disabled{cursor:not-allowed;opacity:.4}
    .ch.off{background:var(--panel-off);color:var(--ink-off)}
    .ch.off .value,.ch.off .code{color:var(--ink-off)}
    .ch.off .description{color:#4B4E45}
    .ch.aux{border-style:dashed;border-color:#8A5E15}
    .ch.aux .ch-code{border-right-style:dashed;border-right-color:#8A5E15}
    .ch.aux .ch-ctl{border-left-style:dashed;border-left-color:#8A5E15}
    .aux-tag{font-family:var(--f-label);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber-deep)}
    @keyframes strike{from{opacity:.25;transform:translateY(-3px)}to{opacity:1;transform:none}}
    @keyframes pulse{0%,100%{box-shadow:0 0 8px rgba(255,178,62,.85)}45%{box-shadow:0 0 0 7px rgba(255,178,62,0);background:#FFF}}
    .ch.flash .value{animation:strike .32s ease-out}
    .ch.flash.live .lamp{animation:pulse .45s ease-out}

    /* ---- drawers ---- */
    .drawer{padding:0}
    .drawer summary{list-style:none;padding:15px 20px;font-family:var(--f-label);font-size:11px;letter-spacing:.2em;
      text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:10px}
    .drawer summary::-webkit-details-marker{display:none}
    .drawer summary::before{content:"▸";color:var(--amber-deep);font-size:13px}
    .drawer[open] summary::before{content:"▾"}
    .drawer summary:hover{background:var(--panel-hi)}
    .drawer-body{padding:4px 20px 22px;border-top:1px solid #9C9A8B}
    .saved-list{display:grid;gap:var(--gap);margin-top:16px}
    .saved-item{border:1px solid #9C9A8B;background:var(--panel-hi);padding:15px}
    .saved-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-family:var(--f-label);
      font-size:11px;letter-spacing:.14em;text-transform:uppercase}
    .saved-head small{color:var(--ink-2);letter-spacing:.08em}
    .saved-item ul{list-style:none;margin:11px 0 14px;padding:0;display:grid;gap:4px;font-size:13px}
    .saved-item li b{font-family:var(--f-label);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin-right:7px}
    .row{display:flex;gap:8px;flex-wrap:wrap}
    .empty{color:var(--ink-2);font-style:italic;margin:16px 0 0}
    .lib-controls{display:flex;gap:14px;flex-wrap:wrap;margin:16px 0 0;align-items:flex-end}
    .lib-controls label{display:grid;gap:5px;font-family:var(--f-label);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
    .lib-controls select,.lib-controls input,.custom-form input{border:1px solid #7E7C6E;background:var(--panel-hi);
      color:var(--ink);padding:9px 10px;border-radius:2px;font-size:14px}
    .lib-controls input{min-width:280px}
    .lib-meta{font-family:var(--f-label);font-size:11px;letter-spacing:.1em;color:var(--ink-2);margin-top:16px}
    .lib-list{columns:3;column-gap:32px;margin:12px 0 0;padding:0;list-style:none;font-size:13px}
    .lib-list li{break-inside:avoid;margin:0 0 6px;padding-left:14px;text-indent:-14px}
    .lib-list li::before{content:"· ";color:var(--amber-deep)}
    .badge{font-family:var(--f-label);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
      background:var(--amber-deep);color:#F3E7CE;padding:2px 5px;margin-left:5px;border-radius:2px}
    .delete-custom{border:0;background:none;color:var(--rust);padding:0 4px;font-size:11px;text-decoration:underline}
    .custom-form{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
    .custom-form input{flex:1;min-width:200px}
    .noscript{margin:0;padding:16px 20px;background:#F0DCC0;border:1px solid var(--rust);color:#5A2413}

    @media(max-width:820px){
      .ch{grid-template-columns:1fr}
      .ch-code{flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid #9C9A8B;padding:11px 16px}
      .ch.aux .ch-code{border-right:0;border-bottom:1px dashed #8A5E15}
      .ch-ctl{border-left:0;border-top:1px solid #9C9A8B;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:16px}
      .ch.aux .ch-ctl{border-left:0;border-top:1px dashed #8A5E15}
      .reroll{margin:0}
      .transport .key{min-width:0;flex:1 1 46%}
      .go{flex:1 1 100% !important}
      .lib-list{columns:1}
      .lib-controls input{min-width:0;width:100%}
      .lib-controls label{width:100%}
      .spec{grid-template-columns:52px 1fr}
    }
    @media(prefers-reduced-motion:reduce){
      *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
      .caret{opacity:1}
    }
  </style>
</head>
<body>
<main class="rack">
  <header class="unit plate">
    <div>
      <h1>Creative Container Picker</h1>
      <p class="tagline">Experiment with creative forms</p>
    </div>
    <p class="count"><b id="combos">—</b><span>possible containers</span></p>
  </header>

  <noscript><p class="noscript">This tool needs JavaScript enabled in your browser.</p></noscript>

  <section class="unit screen" aria-labelledby="containerHeading">
    <div class="screen-head">
      <h2 id="containerHeading">Current container</h2>
      <button id="save" class="key on-screen" type="button">Save container</button>
    </div>
    <dl id="spec" class="spec"></dl>
    <p class="readout"><span id="prompt"></span><span class="caret" aria-hidden="true"></span></p>
    <div class="screen-actions">
      <button id="copyContainer" class="key on-screen" type="button">Copy container</button>
      <button id="copyPrompt" class="key on-screen" type="button">Copy prompt</button>
    </div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </section>

  <div class="transport" aria-label="Generation controls">
    <button id="generate" class="key go" type="button">Generate container<span class="hint" aria-hidden="true">Space</span></button>
    <button id="unlockAll" class="key" type="button">Unlock all</button>
    <button id="useAll" class="key" type="button">Use all</button>
    <button id="surprise" class="key surprise" type="button">Surprise me</button>
  </div>

  <section id="cards" class="strips" aria-label="Container variables"></section>
  <section id="wildCardWrap" aria-label="Optional creative constraint"></section>

  <details id="savedDetails" class="unit drawer">
    <summary>Saved containers <span id="savedCount"></span></summary>
    <div class="drawer-body"><div id="savedList" class="saved-list"></div></div>
  </details>

  <details id="libraryDetails" class="unit drawer">
    <summary>Browse libraries</summary>
    <div class="drawer-body">
      <div class="lib-controls">
        <label>Category<select id="libraryCategory"></select></label>
        <label>Filter<input id="libraryFilter" type="search" placeholder="Filter options…"></label>
      </div>
      <div id="libraryMeta" class="lib-meta"></div>
      <ol id="libraryList" class="lib-list"></ol>
      <form id="customForm" class="custom-form">
        <input id="customInput" aria-label="New custom option" maxlength="160" placeholder="Add your own option">
        <button class="key" type="submit">Add custom option</button>
      </form>
    </div>
  </details>
</main>

];
const distributions = [
  'standalone webpage','interactive webpage','personal website page','hidden URL','password-protected page','microsite','browser-based installation','downloadable HTML file','progressive web app','YouTube long-form','YouTube Short','vertical video','looping video','video essay','unlisted video','livestream','video premiere','standalone audio file','website audio player','downloadable MP3','podcast feed','private podcast feed','album','EP','audio archive','streaming audio','QR-linked audio','PDF','EPUB','digital booklet','email','newsletter','serialized email','downloadable document','digital zine','webcomic','online archive','printed book','chapbook','zine','postcard','poster','broadside','cassette','vinyl record','CD','USB drive','printed card','box of artifacts','folder / case file','gallery installation','public projection','physical exhibition','book + QR code','poster + audio','postcard + webpage','printed artifact + AR','physical object + hidden URL','live performance + digital archive','exhibition + downloadable files','location-based web experience','geocached artifact','package mailed to recipient','social feed post','threaded post','image carousel','short-form vertical video','private group','direct message','group chat','community forum','serialized social posts','live reading','staged performance','listening session','projection','gallery experience','pop-up event','one-night-only webpage','temporary installation','live interactive session','sent to one person','sent to five people','private family archive','gift','handwritten delivery','private download','invitation-only experience','library checkout object','hotel-room installation','park-bench plaque','telephone hotline','voicemail box','pirate radio broadcast','local-access television segment','digital picture frame','e-ink display','desktop wallpaper series','screensaver','browser extension','offline kiosk','museum audio guide','walking-tour app','train-station screen','receipt printer','vending-machine object','capsule toy','sealed envelope','message in a bottle','newspaper insert','classified advertisement','menu insert','matchbook','bookmark','sticker trail','temporary tattoo','wearable badge','projection on a window','drive-in screening','headphone station','community bulletin board','mail-art exchange','chain letter','time capsule','dead drop','shared hard drive','torrent-like peer exchange','NFC-linked object','calendar subscription','daily lock-screen image','game mod','downloadable save file','fictional software update','command-line program','interactive fiction file','public-domain archive deposit','artist book','accordion foldout','deck of cards','board-game supplement','puzzle box','sound postcard','one-copy edition','object left for a stranger'
];
const wildCards = [
  'use only one image','no cuts','no spoken words','no text','the audience encounters the ending first','must loop seamlessly','use only material created today','include one deliberate error','hide part of the work','make the audience choose what to ignore','release it to five people only','destroy one component afterward','make it printable','make it usable offline','use a single continuous recording','make the interface part of the fiction','include an artifact that appears authentic','begin in the middle','remove all explanatory context','make silence structurally important','require physical movement','create two contradictory versions','make the final section inaccessible on the first visit','present the work as something other than what it actually is','use only black and white','finish it in one day','show no human faces','use one typeface','use no rectangles','include something handwritten','include an unexplained timestamp','repeat one element exactly seven times','let a mistake determine the structure','make every transition visible','never show the source material directly','make the shortest element the most important','require headphones','forbid headphones','design it for one specific room','design it for a stranger','include a false ending','remove the title','make the title longer than the work','use only found sound','record everything in one take','make it fit in a pocket','make it impossible to archive completely','let weather affect the experience','let local time affect the experience','make one choice irreversible','use a dead link deliberately','include instructions that can be misunderstood','withhold one key fact','reveal the construction process','make the credits part of the story','use only source-material colors','make it legible from across a room','make it intimate enough for one person','force a pause of at least one minute','make the audience leave the screen','require an ordinary household object','include a private joke no one can decode','remove your favorite part','use the oldest available technology','imitate a bureaucratic form','hide a second work inside the first','make two elements disagree','include an index','use repetition instead of explanation','make every sound diegetic','let the work remember one thing','let the work forget one thing','end with an unanswered question','make the audience perform a small act','build around a limitation of the device','use only public-domain material','never use the color blue','use a color with narrative meaning','make one component disposable','include a tactile element','make it work without instructions','make the instructions the main event','release it under a pseudonym','leave evidence of an absent person','remove all transitions','make the work deteriorate','allow only one replay','make it readable in either direction','translate one section into an unfamiliar language','replace chronology with geography','make a mundane object feel consequential','include an intentional contradiction','design the ending to change the beginning','make absence the central visual','give the audience less control than they expect','give the audience more responsibility than they want'
];

const categoryDefinitions = [
  {id:'source',label:'Source Material',short:'Source',code:'SRC',description:'The material you already have.',items:sourceMaterials},
  {id:'scale',label:'Duration / Scale',short:'Scale',code:'SCL',description:'The size, rhythm, or span of the experience.',items:scales},
  {id:'visual',label:'Visual Layer',short:'Visual',code:'VIS',description:'What the audience sees.',items:visualLayers},
  {id:'audio',label:'Audio Layer',short:'Audio',code:'AUD',description:'What the audience hears.',items:audioLayers},
  {id:'interaction',label:'Interaction',short:'Interaction',code:'INT',description:'What the audience does.',items:interactions},
  {id:'distribution',label:'Distribution',short:'Distribution',code:'DST',description:'Where and how the work reaches someone.',items:distributions}
];
const wildDefinition = {id:'wild',label:'Wild Card',short:'Constraint',code:'WILD',description:'An optional rule that changes the experiment.',items:wildCards};
const STORAGE = {saved:'ccp.saved.v1',custom:'ccp.custom.v1'};

// ============================================================
// APPLICATION STATE
// ============================================================
const loadJSON = (key,fallback) => {try{return JSON.parse(localStorage.getItem(key)) ?? fallback}catch{return fallback}};
let customOptions = loadJSON(STORAGE.custom,{});
let savedContainers = loadJSON(STORAGE.saved,[]);
const state = Object.fromEntries(categoryDefinitions.map(d=>[d.id,{use:true,locked:false,value:d.items[0]}]));
state.wild={use:false,locked:false,value:wildCards[0]};
let previousSignature='';
const changed=new Set();
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)');

// ============================================================
// GENERATION
// ============================================================
const poolFor = d => [...d.items,...(customOptions[d.id]||[])];
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const signature = () => [...categoryDefinitions,wildDefinition].map(d=>`${state[d.id].use}:${state[d.id].value}`).join('|');
function reroll(id,{unusual=false}={}){
  const d=[...categoryDefinitions,wildDefinition].find(x=>x.id===id); if(!d)return;
  const pool=poolFor(d); let candidates=pool;
  if(unusual && pool.length>8) candidates=pool.slice(Math.floor(pool.length*.45));
  if(candidates.length>1){let next=state[id].value;while(next===state[id].value)next=pick(candidates);state[id].value=next}else state[id].value=candidates[0]||'No options';
  changed.add(id);
}
const CORE_ON=.72,WILD_ON=.3,MIN_LIVE=3;
const liveCount=()=>categoryDefinitions.filter(d=>state[d.id].use).length;
// Locked channels keep both their value and their on/off state; everything else is up for grabs.
function rollChannels(){
  const open=categoryDefinitions.filter(d=>!state[d.id].locked);
  open.forEach(d=>state[d.id].use=Math.random()<CORE_ON);
  if(!state.wild.locked)state.wild.use=Math.random()<WILD_ON;
  const dark=open.filter(d=>!state[d.id].use);
  while(liveCount()<MIN_LIVE&&dark.length)state[dark.splice(Math.floor(Math.random()*dark.length),1)[0].id].use=true;
}
function generate({surprise=false}={}){
  let tries=0;
  do{
    if(surprise){categoryDefinitions.forEach(d=>state[d.id].use=true);state.wild.use=true}else rollChannels();
    [...categoryDefinitions,wildDefinition].forEach(d=>{if(state[d.id].use&&!state[d.id].locked)reroll(d.id,{unusual:surprise})});
    tries++;
  }while(signature()===previousSignature&&tries<8);
  previousSignature=signature();renderAll();
  announce(surprise?'A stranger container appeared.':`New container · ${liveCount()} of 6 channels live.`);
}

// ============================================================
// LOCAL STORAGE
// ============================================================
function persistCustom(){localStorage.setItem(STORAGE.custom,JSON.stringify(customOptions))}
function persistSaved(){localStorage.setItem(STORAGE.saved,JSON.stringify(savedContainers))}
function snapshot(){return {id:Date.now(),created:new Date().toISOString(),values:Object.fromEntries([...categoryDefinitions,wildDefinition].map(d=>[d.id,{...state[d.id]}]))}}
function saveContainer(){const snap=snapshot();savedContainers.unshift(snap);persistSaved();renderSaved();announce('Container saved.');}

// ============================================================
// RENDERING / UI
// ============================================================
const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function cardHTML(d,isWild=false){const s=state[d.id];return `<article class="unit ch ${isWild?'aux':''} ${s.use?'live':'off'}" data-card="${d.id}"><div class="ch-code"><span class="lamp" aria-hidden="true"></span><span class="code">${esc(d.code)}</span>${isWild?'<span class="aux-tag">Optional</span>':''}</div><div class="ch-body"><h3 class="value">${esc(s.value)}</h3><p class="description"><b>${esc(d.label)}</b> ${esc(d.description)}</p></div><div class="ch-ctl"><label class="sw"><input type="checkbox" data-action="use" data-id="${d.id}" ${s.use?'checked':''}> Use</label><label class="sw"><input type="checkbox" data-action="lock" data-id="${d.id}" ${s.locked?'checked':''}> Lock</label><button class="reroll" type="button" data-action="reroll" data-id="${d.id}" ${s.use?'':'disabled'} aria-label="Reroll ${esc(d.label)}">Reroll</button></div></article>`}
function renderCards(){
  document.getElementById('cards').innerHTML=categoryDefinitions.map(d=>cardHTML(d)).join('');
  document.getElementById('wildCardWrap').innerHTML=cardHTML(wildDefinition,true);
  changed.forEach(id=>document.querySelector(`[data-card="${id}"]`)?.classList.add('flash'));
  changed.clear();
}
function activeEntries(values=state){return categoryDefinitions.filter(d=>values[d.id]?.use).map(d=>[d,values[d.id].value])}
function buildPrompt(values=state){const active=activeEntries(values), get=id=>values[id]?.use?values[id].value:null;const article=w=>/^(an?|the)\s/i.test(w)?'':(/^(one|once|eu|u[^aeiou])/i.test(w)?'a ':(/^[aeiou]/i.test(w)?'an ':'a '));const bits=[];if(get('visual'))bits.push(`a visual layer of ${get('visual')}`);if(get('audio'))bits.push(`audio built from ${get('audio')}`);if(get('interaction'))bits.push(`interaction through ${get('interaction')}`);let sentence=`Create ${get('scale')?`${article(get('scale'))}${get('scale')} `:'a '}creative experience${get('source')?` built around ${get('source')}`:''}${get('distribution')?` for distribution as ${get('distribution')}`:''}`;if(bits.length)sentence+=`, using ${bits.join(', ')}`;if(values.wild?.use)sentence+=`. Constraint: ${values.wild.value}`;return sentence.replace(/\s+/g,' ').replace(/\.$/,'')+'.';}
function containerText(values=state){const lines=activeEntries(values).map(([d,v])=>`${d.short}: ${v}`);if(values.wild?.use)lines.push(`Constraint: ${values.wild.value}`);return `Creative Container\n\n${lines.join('\n')}\n\nPrompt: ${buildPrompt(values)}`}
function typePrompt(text){
  const el=document.getElementById('prompt');
  if(el.textContent===text)return;
  clearInterval(typePrompt.timer);
  if(reduceMotion.matches){el.textContent=text;return}
  const step=Math.max(1,Math.ceil(text.length/38));let i=0;el.textContent='';
  typePrompt.timer=setInterval(()=>{i+=step;el.textContent=text.slice(0,i);if(i>=text.length)clearInterval(typePrompt.timer)},14);
}
function renderSummary(){
  const entries=activeEntries();if(state.wild.use)entries.push([wildDefinition,state.wild.value]);
  document.getElementById('spec').innerHTML=entries.length?entries.map(([d,v])=>`<dt>${esc(d.code)}</dt><dd>${esc(v)}</dd>`).join(''):'<dt>—</dt><dd>No active variables. Switch one on below.</dd>';
  typePrompt(buildPrompt());
}
const SUP='⁰¹²³⁴⁵⁶⁷⁸⁹';
function renderCombos(){
  let n=1;categoryDefinitions.forEach(d=>n*=poolFor(d).length);n*=poolFor(wildDefinition).length+1;
  const e=Math.floor(Math.log10(n)),m=(n/Math.pow(10,e)).toFixed(1);
  document.getElementById('combos').textContent=`${m} × 10${String(e).split('').map(c=>SUP[+c]).join('')}`;
}
function renderSaved(){const root=document.getElementById('savedList');document.getElementById('savedCount').textContent=`(${savedContainers.length})`;if(!savedContainers.length){root.innerHTML='<p class="empty">Nothing saved yet. Generate a container you like, then save it.</p>';return}root.innerHTML=savedContainers.map((s,i)=>{const entries=activeEntries(s.values);if(s.values.wild?.use)entries.push([wildDefinition,s.values.wild.value]);return `<article class="saved-item"><div class="saved-head"><strong>Container ${savedContainers.length-i}</strong><small>${new Date(s.created).toLocaleDateString()}</small></div><ul>${entries.map(([d,v])=>`<li><b>${esc(d.code)}</b>${esc(v)}</li>`).join('')}</ul><div class="row"><button class="key" data-saved="copy" data-id="${s.id}" type="button">Copy</button><button class="key" data-saved="load" data-id="${s.id}" type="button">Load</button><button class="key danger" data-saved="delete" data-id="${s.id}" type="button">Delete</button></div></article>`}).join('')}
function renderLibrary(){const id=document.getElementById('libraryCategory').value||'source';const d=[...categoryDefinitions,wildDefinition].find(x=>x.id===id);const q=document.getElementById('libraryFilter').value.trim().toLowerCase();const built=d.items.map(value=>({value,custom:false}));const custom=(customOptions[id]||[]).map(value=>({value,custom:true}));const all=[...built,...custom].filter(x=>x.value.toLowerCase().includes(q));document.getElementById('libraryMeta').textContent=`${all.length} shown · ${d.items.length} built in · ${custom.length} custom`;document.getElementById('libraryList').innerHTML=all.map(x=>`<li>${esc(x.value)}${x.custom?` <span class="badge">Custom</span> <button type="button" class="delete-custom" data-delete-custom="${esc(x.value)}" aria-label="Delete custom option ${esc(x.value)}">Delete</button>`:''}</li>`).join('')||'<li class="empty">No matches.</li>'}
function renderAll(){renderCards();renderSummary();renderCombos()}
function announce(message){const el=document.getElementById('status');el.textContent=message;clearTimeout(announce.timer);announce.timer=setTimeout(()=>{el.textContent=''},2600)}
async function copyText(text,label='Copied.') {try{await navigator.clipboard.writeText(text)}catch{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}announce(label)}

// ============================================================
// EVENTS
// ============================================================
document.addEventListener('change',e=>{const id=e.target.dataset.id,action=e.target.dataset.action;if(!id||!action)return;state[id][action==='use'?'use':'locked']=e.target.checked;renderAll()});
document.addEventListener('click',e=>{const action=e.target.dataset.action,id=e.target.dataset.id;if(action==='reroll'){reroll(id);previousSignature=signature();renderAll();announce(`${id==='wild'?'Wild Card':([...categoryDefinitions].find(d=>d.id===id)?.label||'Variable')} rerolled.`)}const savedAction=e.target.dataset.saved;if(savedAction){const saved=savedContainers.find(s=>String(s.id)===e.target.dataset.id);if(!saved)return;if(savedAction==='copy')copyText(containerText(saved.values));if(savedAction==='load'){Object.keys(saved.values).forEach(k=>state[k]={...saved.values[k]});previousSignature=signature();renderAll();announce('Saved container loaded.');window.scrollTo({top:0,behavior:'smooth'})}if(savedAction==='delete'){savedContainers=savedContainers.filter(s=>s!==saved);persistSaved();renderSaved();announce('Saved container deleted.')}}if(e.target.dataset.deleteCustom){const cat=document.getElementById('libraryCategory').value;customOptions[cat]=(customOptions[cat]||[]).filter(v=>v!==e.target.dataset.deleteCustom);persistCustom();renderLibrary();renderCombos();announce('Custom option deleted.')}});
document.getElementById('generate').addEventListener('click',()=>generate());document.getElementById('surprise').addEventListener('click',()=>generate({surprise:true}));
document.getElementById('unlockAll').addEventListener('click',()=>{[...categoryDefinitions,wildDefinition].forEach(d=>state[d.id].locked=false);renderAll();announce('All variables unlocked.')});
document.getElementById('useAll').addEventListener('click',()=>{categoryDefinitions.forEach(d=>state[d.id].use=true);renderAll();announce('All six core variables active.')});
document.getElementById('copyContainer').addEventListener('click',()=>copyText(containerText()));document.getElementById('copyPrompt').addEventListener('click',()=>copyText(buildPrompt()));document.getElementById('save').addEventListener('click',saveContainer);
document.addEventListener('keydown',e=>{if(e.code!=='Space'||e.repeat||e.altKey||e.ctrlKey||e.metaKey)return;const tag=document.activeElement?.tagName;if(['INPUT','TEXTAREA','SELECT','BUTTON','SUMMARY'].includes(tag)||document.activeElement?.isContentEditable)return;e.preventDefault();generate()});
const categorySelect=document.getElementById('libraryCategory');categorySelect.innerHTML=[...categoryDefinitions,wildDefinition].map(d=>`<option value="${d.id}">${esc(d.label)}</option>`).join('');categorySelect.addEventListener('change',renderLibrary);document.getElementById('libraryFilter').addEventListener('input',renderLibrary);
document.getElementById('customForm').addEventListener('submit',e=>{e.preventDefault();const input=document.getElementById('customInput'),value=input.value.trim(),id=categorySelect.value;if(!value)return;const all=poolFor([...categoryDefinitions,wildDefinition].find(d=>d.id===id));if(all.some(v=>v.toLowerCase()===value.toLowerCase())){announce('That option already exists.');return}(customOptions[id]??=[]).push(value);persistCustom();input.value='';renderLibrary();renderCombos();announce('Custom option added.')});
for(const details of document.querySelectorAll('details')){
  const summary=details.querySelector('summary');
  summary.setAttribute('aria-expanded',String(details.open));
  details.addEventListener('toggle',()=>summary.setAttribute('aria-expanded',String(details.open)));
}

generate();renderSaved();renderLibrary();
</script>
</body>
